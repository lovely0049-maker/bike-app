<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서울 따릉이 대여소 실시간 현황</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ttareung: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }
        .spin-animation {
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                
                <!-- Logo & Data Source Badge -->
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-emerald-500 flex items-center justify-center text-white shadow-md shadow-emerald-100">
                        <!-- Bike Icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
                        </svg>
                    </div>
                    <div>
                        <div class="flex items-center gap-2">
                            <h1 class="text-xl font-bold text-slate-900 tracking-tight">서울 따릉이 대여소 현황</h1>
                            <!-- Data Source Badge -->
                            <span id="data-source-badge" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-100 text-amber-800 border border-amber-300">
                                데이터 불러오는 중...
                            </span>
                        </div>
                        <p class="text-xs text-slate-500 mt-0.5">실시간 자전거 수량 · 즐겨찾기 · 내 위치 기반 거리 계산</p>
                    </div>
                </div>

                <!-- GPS & Refresh Buttons & Last Updated Time -->
                <div class="flex items-center justify-between sm:justify-end gap-2 sm:gap-3 bg-slate-50 sm:bg-transparent p-2 sm:p-0 rounded-lg">
                    
                    <!-- GPS Location Button -->
                    <button id="gps-btn" onclick="requestUserLocation()" class="inline-flex items-center justify-center px-3 py-2 rounded-lg text-xs sm:text-sm font-medium text-slate-700 bg-white border border-slate-200 hover:bg-slate-100 active:bg-slate-200 transition-all shadow-sm gap-1.5 focus:outline-none">
                        <svg id="gps-icon" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                        <span id="gps-btn-text">내 위치 찾기</span>
                    </button>

                    <!-- Timestamp -->
                    <div class="text-right px-1">
                        <div class="text-[10px] sm:text-xs text-slate-400">마지막 갱신 시각</div>
                        <div id="last-updated-time" class="text-xs font-mono font-medium text-slate-700">----- --:--:--</div>
                    </div>

                    <!-- Refresh Button -->
                    <button id="refresh-btn" onclick="fetchBikeStatus()" class="inline-flex items-center justify-center px-3.5 py-2 rounded-lg text-xs sm:text-sm font-medium text-white bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 transition-all shadow-sm gap-1.5 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2">
                        <svg id="refresh-icon" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                        </svg>
                        <span>새로고침</span>
                    </button>
                </div>

            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">

        <!-- Summary Statistics Dashboard -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4 mb-6">
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <div class="text-xs font-medium text-slate-500">전체 대여소</div>
                <div id="stat-total-stations" class="text-2xl font-bold text-slate-800 mt-1">0 <span class="text-xs font-normal text-slate-500">개소</span></div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <div class="text-xs font-medium text-slate-500">대여 가능 자전거</div>
                <div id="stat-total-bikes" class="text-2xl font-bold text-emerald-600 mt-1">0 <span class="text-xs font-normal text-slate-500">대</span></div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <div class="text-xs font-medium text-slate-500">대여 불가 (0대)</div>
                <div id="stat-empty-stations" class="text-2xl font-bold text-rose-600 mt-1">0 <span class="text-xs font-normal text-slate-500">개소</span></div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <div class="text-xs font-medium text-slate-500">즐겨찾기 대여소</div>
                <div id="stat-fav-count" class="text-2xl font-bold text-amber-500 mt-1">0 <span class="text-xs font-normal text-slate-500">개소</span></div>
            </div>
        </div>

        <!-- Controls: Search, Filter Tabs & Sort Options -->
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-6 space-y-4 lg:space-y-0 lg:flex lg:items-center lg:justify-between gap-4">
            
            <!-- Search Bar -->
            <div class="relative flex-1">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                    <svg class="h-4 w-4 text-slate-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </div>
                <input type="text" id="search-input" oninput="handleSearch()" placeholder="대여소 이름 검색 (예: 망원역, 합정역, 102)..." class="block w-full pl-10 pr-10 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 text-sm bg-slate-50 focus:bg-white transition-colors">
                <button id="clear-search-btn" onclick="clearSearch()" class="hidden absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600">
                    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <!-- Filters & Sorting Controls -->
            <div class="flex flex-wrap items-center justify-between sm:justify-start gap-2">
                
                <!-- Filter Tabs -->
                <div class="inline-flex p-1 bg-slate-100 rounded-lg text-xs font-medium">
                    <button id="filter-all-btn" onclick="setFilter('all')" class="px-3 py-1.5 rounded-md bg-white text-slate-800 shadow-sm transition-all">전체</button>
                    <button id="filter-fav-btn" onclick="setFilter('fav')" class="px-3 py-1.5 rounded-md text-slate-600 hover:text-slate-900 transition-all flex items-center gap-1">
                        <span class="text-amber-500">★</span> 즐겨찾기
                    </button>
                    <button id="filter-available-btn" onclick="setFilter('available')" class="px-3 py-1.5 rounded-md text-slate-600 hover:text-slate-900 transition-all">대여 가능만</button>
                    <button id="filter-empty-btn" onclick="setFilter('empty')" class="px-3 py-1.5 rounded-md text-slate-600 hover:text-slate-900 transition-all">대여 불가만 (0대)</button>
                </div>

                <!-- Sort Selection Dropdown -->
                <select id="sort-select" onchange="handleSort()" class="py-1.5 px-3 border border-slate-300 rounded-lg text-xs font-medium bg-white focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
                    <option value="fav-first">기본 (즐겨찾기 상단 + 이름순)</option>
                    <option value="distance" id="sort-distance-option" disabled>내 위치 가까운 순 (GPS 필요)</option>
                    <option value="bike-desc">자전거 많은순</option>
                    <option value="bike-asc">자전거 적은순</option>
                    <option value="shared-desc">거치율 높은순</option>
                </select>

            </div>
        </div>

        <!-- Station Cards Container -->
        <div id="station-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Cards rendered dynamically via JavaScript -->
        </div>

        <!-- Empty State Container -->
        <div id="empty-state" class="hidden text-center py-16 bg-white rounded-xl border border-slate-200 shadow-sm">
            <svg class="mx-auto h-12 w-12 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 9.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <h3 class="mt-3 text-sm font-semibold text-slate-800">조회된 대여소가 없습니다</h3>
            <p class="mt-1 text-xs text-slate-500">검색어나 필터 조건을 변경해 보세요.</p>
            <button onclick="clearSearch(); setFilter('all');" class="mt-4 px-3.5 py-2 text-xs font-medium text-emerald-700 bg-emerald-50 rounded-lg hover:bg-emerald-100 transition-colors">
                필터 초기화
            </button>
        </div>

    </main>

    <!-- JavaScript Application Logic -->
    <script>
        // 요구사항 내장 샘플 데이터 (API 요청 실패 시 자동 폴백)
        const SAMPLE_DATA = {
            "rentBikeStatus": {
                "list_total_count": 6,
                "RESULT": {"CODE": "INFO-000", "MESSAGE": "정상 처리되었습니다"},
                "row": [
                    {"rackTotCnt": "15", "stationName": "102. 망원역 1번출구 앞", "parkingBikeTotCnt": "0", "shared": "0", "stationLatitude": "37.555648", "stationLongitude": "126.910027", "stationId": "ST-10"},
                    {"rackTotCnt": "10", "stationName": "103. 망원역 2번출구 앞", "parkingBikeTotCnt": "5", "shared": "50", "stationLatitude": "37.554951", "stationLongitude": "126.910835", "stationId": "ST-11"},
                    {"rackTotCnt": "20", "stationName": "104. 합정역 1번출구 앞", "parkingBikeTotCnt": "12", "shared": "60", "stationLatitude": "37.549789", "stationLongitude": "126.913757", "stationId": "ST-12"},
                    {"rackTotCnt": "10", "stationName": "105. 합정역 5번출구 앞", "parkingBikeTotCnt": "0", "shared": "0", "stationLatitude": "37.550012", "stationLongitude": "126.914821", "stationId": "ST-13"},
                    {"rackTotCnt": "12", "stationName": "106. 합정역 7번출구 앞", "parkingBikeTotCnt": "8", "shared": "67", "stationLatitude": "37.548683", "stationLongitude": "126.912821", "stationId": "ST-14"},
                    {"rackTotCnt": "15", "stationName": "207. 여의나루역 1번출구 앞", "parkingBikeTotCnt": "3", "shared": "20", "stationLatitude": "37.526989", "stationLongitude": "126.928421", "stationId": "ST-15"}
                ]
            }
        };

        // Application Global State
        let rawStationList = []; // Processed station data array
        let favorites = new Set(); // Set of favorite station IDs
        let userLocation = null; // { lat, lng }
        let currentFilter = 'all'; // 'all' | 'fav' | 'available' | 'empty'
        let currentSearchQuery = '';
        let currentSort = 'fav-first';

        // Initialize on DOM Ready
        window.addEventListener('DOMContentLoaded', () => {
            loadFavoritesFromStorage();
            fetchBikeStatus();
        });

        /**
         * Load favorites from browser LocalStorage ('ttarung_favs')
         */
        function loadFavoritesFromStorage() {
            try {
                const stored = localStorage.getItem('ttarung_favs');
                if (stored) {
                    favorites = new Set(JSON.parse(stored));
                }
            } catch (e) {
                console.error('Failed to load favorites from localStorage', e);
                favorites = new Set();
            }
        }

        /**
         * Save favorites to browser LocalStorage ('ttarung_favs')
         */
        function saveFavoritesToStorage() {
            try {
                localStorage.setItem('ttarung_favs', JSON.stringify(Array.from(favorites)));
            } catch (e) {
                console.error('Failed to save favorites to localStorage', e);
            }
        }

        /**
         * Toggle favorite status of a station
         */
        function toggleFavorite(stationId, event) {
            if (event) event.stopPropagation();

            if (favorites.has(stationId)) {
                favorites.delete(stationId);
            } else {
                favorites.add(stationId);
            }

            saveFavoritesToStorage();
            updateDashboardStats();
            renderStations();
        }

        /**
         * Fetches data from /api/bike endpoint.
         * Falls back to SAMPLE_DATA on error or non-200 response.
         */
        async function fetchBikeStatus() {
            const refreshIcon = document.getElementById('refresh-icon');
            const badge = document.getElementById('data-source-badge');
            
            refreshIcon.classList.add('spin-animation');

            try {
                const response = await fetch('/api/bike');
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                
                if (data && data.rentBikeStatus && Array.isArray(data.rentBikeStatus.row)) {
                    processStationData(data.rentBikeStatus.row);
                    badge.textContent = '실시간 데이터';
                    badge.className = 'inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800 border border-emerald-300';
                } else {
                    throw new Error('Invalid JSON format');
                }

            } catch (error) {
                console.warn('API fetch failed, falling back to sample data:', error.message);
                
                processStationData(SAMPLE_DATA.rentBikeStatus.row);

                badge.textContent = '샘플 데이터 사용 중';
                badge.className = 'inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-100 text-amber-800 border border-amber-300';
            } finally {
                setTimeout(() => {
                    refreshIcon.classList.remove('spin-animation');
                }, 400);

                updateTimestamp();
            }
        }

        /**
         * Cleans & converts string values into numbers and updates state.
         */
        function processStationData(rowData) {
            rawStationList = rowData.map((item, index) => {
                const id = item.stationId || item.stationName || `ST-${index}`;
                const bikes = parseInt(item.parkingBikeTotCnt, 10) || 0;
                const racks = parseInt(item.rackTotCnt, 10) || 0;
                const sharedVal = parseInt(item.shared, 10) || 0;
                const lat = parseFloat(item.stationLatitude) || 0;
                const lng = parseFloat(item.stationLongitude) || 0;

                return {
                    stationId: id,
                    stationName: item.stationName || '미지정 대여소',
                    parkingBikeTotCnt: bikes,
                    rackTotCnt: racks,
                    shared: sharedVal,
                    stationLatitude: lat,
                    stationLongitude: lng,
                    distanceKm: userLocation ? calculateDistance(userLocation.lat, userLocation.lng, lat, lng) : null
                };
            });

            updateDashboardStats();
            renderStations();
        }

        /**
         * Request User Geolocation via Geolocation API
         */
        function requestUserLocation() {
            const gpsBtnText = document.getElementById('gps-btn-text');
            const gpsIcon = document.getElementById('gps-icon');
            const sortOption = document.getElementById('sort-distance-option');

            if (!navigator.geolocation) {
                alert('사용 중인 브라우저가 위치 정보(GPS)를 지원하지 않습니다.');
                return;
            }

            gpsBtnText.textContent = '위치 검색 중...';
            gpsIcon.classList.add('spin-animation');

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    userLocation = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    };

                    // Recalculate distances for all stations
                    rawStationList.forEach(item => {
                        item.distanceKm = calculateDistance(userLocation.lat, userLocation.lng, item.stationLatitude, item.stationLongitude);
                    });

                    gpsBtnText.textContent = '위치 확인됨';
                    gpsIcon.classList.remove('spin-animation');
                    sortOption.disabled = false;
                    sortOption.textContent = '내 위치 가까운 순';

                    // Auto switch to distance sort
                    currentSort = 'distance';
                    document.getElementById('sort-select').value = 'distance';

                    renderStations();
                },
                (error) => {
                    console.error('Geolocation Error:', error);
                    gpsBtnText.textContent = '위치 찾기 실패';
                    gpsIcon.classList.remove('spin-animation');
                    alert('위치 정보를 가져올 수 없습니다. 브라우저 위치 권한을 확인해 주세요.');
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
            );
        }

        /**
         * Haversine Formula for Distance Calculation between two Earth coordinates (in km)
         */
        function calculateDistance(lat1, lon1, lat2, lon2) {
            if (!lat1 || !lon1 || !lat2 || !lon2) return null;
            const R = 6371; // Radius of Earth in kilometers
            const dLat = (lat2 - lat1) * (Math.PI / 180);
            const dLon = (lon2 - lon1) * (Math.PI / 180);
            const a = 
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) * 
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c; // Distance in Km
        }

        /**
         * Format distance in meters or kilometers
         */
        function formatDistance(distKm) {
            if (distKm === null || distKm === undefined || isNaN(distKm)) return null;
            if (distKm < 1) {
                return `${Math.round(distKm * 1000)}m`;
            }
            return `${distKm.toFixed(1)}km`;
        }

        /**
         * Updates dashboard summary cards
         */
        function updateDashboardStats() {
            const totalStations = rawStationList.length;
            const totalBikes = rawStationList.reduce((acc, item) => acc + item.parkingBikeTotCnt, 0);
            const emptyStations = rawStationList.filter(item => item.parkingBikeTotCnt === 0).length;
            const favCount = favorites.size;

            document.getElementById('stat-total-stations').textContent = totalStations.toLocaleString();
            document.getElementById('stat-total-bikes').textContent = totalBikes.toLocaleString();
            document.getElementById('stat-empty-stations').textContent = emptyStations.toLocaleString();
            document.getElementById('stat-fav-count').textContent = favCount.toLocaleString();
        }

        /**
         * Filters, sorts, and renders the station list
         */
        function renderStations() {
            const container = document.getElementById('station-list');
            const emptyState = document.getElementById('empty-state');

            // 1. Filter Logic
            let filtered = rawStationList.filter(item => {
                const matchesSearch = item.stationName.toLowerCase().includes(currentSearchQuery.toLowerCase());
                const isFav = favorites.has(item.stationId);

                let matchesFilter = true;
                if (currentFilter === 'fav') {
                    matchesFilter = isFav;
                } else if (currentFilter === 'available') {
                    matchesFilter = item.parkingBikeTotCnt > 0;
                } else if (currentFilter === 'empty') {
                    matchesFilter = item.parkingBikeTotCnt === 0;
                }

                return matchesSearch && matchesFilter;
            });

            // 2. Sorting Logic
            filtered.sort((a, b) => {
                const isFavA = favorites.has(a.stationId);
                const isFavB = favorites.has(b.stationId);

                if (currentSort === 'fav-first') {
                    // Favorites first, then station name
                    if (isFavA !== isFavB) return isFavB ? 1 : -1;
                    return a.stationName.localeCompare(b.stationName, 'ko');
                } else if (currentSort === 'distance') {
                    if (a.distanceKm === null) return 1;
                    if (b.distanceKm === null) return -1;
                    return a.distanceKm - b.distanceKm;
                } else if (currentSort === 'bike-desc') {
                    return b.parkingBikeTotCnt - a.parkingBikeTotCnt;
                } else if (currentSort === 'bike-asc') {
                    return a.parkingBikeTotCnt - b.parkingBikeTotCnt;
                } else if (currentSort === 'shared-desc') {
                    return b.shared - a.shared;
                }
                return 0;
            });

            // Handle empty search / filter state
            if (filtered.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            // 3. Render Station Cards
            container.innerHTML = filtered.map(item => createStationCardHTML(item)).join('');
        }

        /**
         * Creates HTML markup for a single station card.
         * Highlighted in RED when parkingBikeTotCnt === 0.
         */
        function createStationCardHTML(item) {
            const isEmpty = item.parkingBikeTotCnt === 0;
            const isFav = favorites.has(item.stationId);
            const formattedDist = formatDistance(item.distanceKm);

            // Styling variables based on status
            const cardBgClass = isEmpty 
                ? 'bg-rose-50/90 border-rose-300 shadow-rose-100/50 hover:border-rose-400' 
                : (isFav ? 'bg-amber-50/30 border-amber-200 hover:border-amber-300' : 'bg-white border-slate-200 hover:border-emerald-300 hover:shadow-md');

            const badgeMarkup = isEmpty
                ? `<span class="inline-flex items-center px-2 py-0.5 rounded-md text-xs font-bold bg-rose-600 text-white shadow-sm">
                        <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                        대여 불가 (0대)
                   </span>`
                : `<span class="inline-flex items-center px-2 py-0.5 rounded-md text-xs font-bold bg-emerald-100 text-emerald-800">
                        ${item.parkingBikeTotCnt}대 대여 가능
                   </span>`;

            const bikeCountColor = isEmpty ? 'text-rose-600 font-extrabold' : 'text-emerald-600 font-bold';
            const capacityRatio = item.rackTotCnt > 0 ? Math.min(Math.round((item.parkingBikeTotCnt / item.rackTotCnt) * 100), 100) : 0;
            const progressBgColor = isEmpty ? 'bg-rose-500' : 'bg-emerald-500';

            return `
                <div class="rounded-xl border p-4 sm:p-5 transition-all duration-200 relative overflow-hidden ${cardBgClass}">
                    
                    <!-- Header: Station Name, Distance Tag & Favorite Star -->
                    <div class="flex items-start justify-between gap-2 mb-3">
                        <div>
                            <div class="flex items-center gap-1.5 flex-wrap mb-1">
                                <h2 class="text-base font-bold text-slate-900 leading-snug break-all">${escapeHTML(item.stationName)}</h2>
                            </div>
                            
                            <!-- Distance Tag if available -->
                            ${formattedDist ? `
                                <span class="inline-flex items-center text-xs font-medium text-slate-500 bg-slate-100 px-2 py-0.5 rounded-md">
                                    📍 내 위치에서 ${formattedDist}
                                </span>
                            ` : ''}
                        </div>

                        <!-- Favorite Star Button -->
                        <button onclick="toggleFavorite('${escapeHTML(item.stationId)}', event)" title="${isFav ? '즐겨찾기 해제' : '즐겨찾기 추가'}" class="p-1 rounded-full hover:bg-slate-100 transition-colors focus:outline-none">
                            <span class="text-2xl leading-none ${isFav ? 'text-amber-400' : 'text-slate-300 hover:text-amber-300'}">
                                ${isFav ? '★' : '☆'}
                            </span>
                        </button>
                    </div>

                    <!-- Status Badge -->
                    <div class="mb-3">
                        ${badgeMarkup}
                    </div>

                    <!-- Statistics Grid -->
                    <div class="grid grid-cols-3 gap-2 py-2.5 my-2 border-y ${isEmpty ? 'border-rose-200/60 bg-rose-100/30' : 'border-slate-100 bg-slate-50'} rounded-lg px-2">
                        <div class="text-center">
                            <span class="block text-[11px] font-medium text-slate-500">대여 가능</span>
                            <span class="text-base sm:text-lg ${bikeCountColor}">${item.parkingBikeTotCnt}<span class="text-xs font-normal text-slate-500">대</span></span>
                        </div>
                        <div class="text-center border-x ${isEmpty ? 'border-rose-200/60' : 'border-slate-200/60'}">
                            <span class="block text-[11px] font-medium text-slate-500">총 거치대</span>
                            <span class="text-base sm:text-lg font-bold text-slate-700">${item.rackTotCnt}<span class="text-xs font-normal text-slate-500">개</span></span>
                        </div>
                        <div class="text-center">
                            <span class="block text-[11px] font-medium text-slate-500">거치율</span>
                            <span class="text-base sm:text-lg font-bold ${isEmpty ? 'text-rose-600' : 'text-slate-800'}">${item.shared}%</span>
                        </div>
                    </div>

                    <!-- Capacity Progress Bar -->
                    <div class="mt-2">
                        <div class="flex justify-between items-center text-[11px] text-slate-500 mb-1">
                            <span>거치 수량 상태</span>
                            <span class="font-medium">${capacityRatio}%</span>
                        </div>
                        <div class="w-full bg-slate-200/80 h-1.5 rounded-full overflow-hidden">
                            <div class="${progressBgColor} h-1.5 rounded-full transition-all duration-300" style="width: ${capacityRatio}%"></div>
                        </div>
                    </div>

                </div>
            `;
        }

        // Search & Filter Handlers
        function handleSearch() {
            const input = document.getElementById('search-input');
            const clearBtn = document.getElementById('clear-search-btn');
            currentSearchQuery = input.value.trim();

            if (currentSearchQuery.length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }

            renderStations();
        }

        function clearSearch() {
            const input = document.getElementById('search-input');
            const clearBtn = document.getElementById('clear-search-btn');
            input.value = '';
            currentSearchQuery = '';
            clearBtn.classList.add('hidden');
            renderStations();
        }

        function setFilter(filterType) {
            currentFilter = filterType;

            const btnAll = document.getElementById('filter-all-btn');
            const btnFav = document.getElementById('filter-fav-btn');
            const btnAvailable = document.getElementById('filter-available-btn');
            const btnEmpty = document.getElementById('filter-empty-btn');

            [btnAll, btnFav, btnAvailable, btnEmpty].forEach(btn => {
                btn.className = 'px-3 py-1.5 rounded-md text-slate-600 hover:text-slate-900 transition-all';
            });

            if (filterType === 'all') {
                btnAll.className = 'px-3 py-1.5 rounded-md bg-white text-slate-900 font-semibold shadow-sm transition-all';
            } else if (filterType === 'fav') {
                btnFav.className = 'px-3 py-1.5 rounded-md bg-amber-500 text-white font-semibold shadow-sm transition-all';
            } else if (filterType === 'available') {
                btnAvailable.className = 'px-3 py-1.5 rounded-md bg-emerald-600 text-white font-semibold shadow-sm transition-all';
            } else if (filterType === 'empty') {
                btnEmpty.className = 'px-3 py-1.5 rounded-md bg-rose-600 text-white font-semibold shadow-sm transition-all';
            }

            renderStations();
        }

        function handleSort() {
            const select = document.getElementById('sort-select');
            currentSort = select.value;
            renderStations();
        }

        function updateTimestamp() {
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const hh = String(now.getHours()).padStart(2, '0');
            const mi = String(now.getMinutes()).padStart(2, '0');
            const ss = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('last-updated-time').textContent = `${yyyy}-${mm}-${dd} ${hh}:${mi}:${ss}`;
        }

        function escapeHTML(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
