<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서울시 따릉이 대여소 실시간 현황</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ttareung: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }
        .spin-animation {
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

    <!-- Header Section -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                
                <!-- Logo & Title -->
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-full bg-emerald-500 flex items-center justify-center text-white shadow-md">
                        <!-- Bike Icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
                        </svg>
                    </div>
                    <div>
                        <div class="flex items-center gap-2">
                            <h1 class="text-xl font-bold text-slate-900 tracking-tight">서울 따릉이 대여소 현황</h1>
                            <!-- Data Source Badge -->
                            <span id="data-source-badge" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-100 text-amber-800 border border-amber-300">
                                불러오는 중...
                            </span>
                        </div>
                        <p class="text-xs text-slate-500 mt-0.5">실시간 자전거 보유량 및 거치대 현황 조회</p>
                    </div>
                </div>

                <!-- Refresh Button & Last Updated Time -->
                <div class="flex items-center justify-between sm:justify-end gap-3 bg-slate-50 sm:bg-transparent p-2 sm:p-0 rounded-lg">
                    <div class="text-right">
                        <div class="text-xs text-slate-400">마지막 갱신 시각</div>
                        <div id="last-updated-time" class="text-xs font-mono font-medium text-slate-700">--:--:--</div>
                    </div>
                    <button id="refresh-btn" onclick="fetchBikeStatus()" class="inline-flex items-center justify-center px-3.5 py-2 rounded-lg text-sm font-medium text-white bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 transition-all shadow-sm gap-2 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2">
                        <svg id="refresh-icon" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                        </svg>
                        <span>새로고침</span>
                    </button>
                </div>

            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">

        <!-- Summary Statistics Dashboard -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <div class="text-xs font-medium text-slate-500">조회된 대여소</div>
                <div id="stat-total-stations" class="text-2xl font-bold text-slate-800 mt-1">0 <span class="text-xs font-normal text-slate-500">개소</span></div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <div class="text-xs font-medium text-slate-500">대여 가능 자전거</div>
                <div id="stat-total-bikes" class="text-2xl font-bold text-emerald-600 mt-1">0 <span class="text-xs font-normal text-slate-500">대</span></div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <div class="text-xs font-medium text-slate-500">대여 불가 대여소 (0대)</div>
                <div id="stat-empty-stations" class="text-2xl font-bold text-rose-600 mt-1">0 <span class="text-xs font-normal text-slate-500">개소</span></div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <div class="text-xs font-medium text-slate-500">평균 거치율</div>
                <div id="stat-avg-shared" class="text-2xl font-bold text-slate-800 mt-1">0%</div>
            </div>
        </div>

        <!-- Controls: Search & Filter & Sort -->
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-6 space-y-4 md:space-y-0 md:flex md:items-center md:justify-between gap-4">
            
            <!-- Search Bar -->
            <div class="relative flex-1">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg class="h-5 w-5 text-slate-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </div>
                <input type="text" id="search-input" oninput="handleSearch()" placeholder="대여소 이름 검색 (예: 망원역, 합정역, 102)..." class="block w-full pl-10 pr-10 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 text-sm bg-slate-50 focus:bg-white transition-colors">
                <button id="clear-search-btn" onclick="clearSearch()" class="hidden absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600">
                    <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <!-- Filters & Sorting Controls -->
            <div class="flex flex-wrap items-center gap-2 sm:gap-3">
                
                <!-- Status Filter Buttons -->
                <div class="inline-flex p-1 bg-slate-100 rounded-lg text-xs font-medium">
                    <button id="filter-all-btn" onclick="setFilter('all')" class="px-3 py-1.5 rounded-md bg-white text-slate-800 shadow-sm transition-all">전체</button>
                    <button id="filter-available-btn" onclick="setFilter('available')" class="px-3 py-1.5 rounded-md text-slate-600 hover:text-slate-900 transition-all">대여 가능만</button>
                    <button id="filter-empty-btn" onclick="setFilter('empty')" class="px-3 py-1.5 rounded-md text-slate-600 hover:text-slate-900 transition-all">대여 불가만 (0대)</button>
                </div>

                <!-- Sort Selection -->
                <select id="sort-select" onchange="handleSort()" class="py-2 px-3 border border-slate-300 rounded-lg text-xs font-medium bg-white focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
                    <option value="name">이름순</option>
                    <option value="bike-desc">자전거 많은순</option>
                    <option value="bike-asc">자전거 적은순</option>
                    <option value="shared-desc">거치율 높은순</option>
                </select>

            </div>
        </div>

        <!-- Station Status List Container -->
        <div id="station-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Cards generated dynamically via JavaScript -->
        </div>

        <!-- Empty State Container (When search returns zero results) -->
        <div id="empty-state" class="hidden text-center py-16 bg-white rounded-xl border border-slate-200 shadow-sm">
            <svg class="mx-auto h-12 w-12 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 9.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <h3 class="mt-3 text-sm font-semibold text-slate-800">검색 결과가 없습니다</h3>
            <p class="mt-1 text-xs text-slate-500">검색어 단어를 확인하거나 필터 조건을 변경해 보세요.</p>
            <button onclick="clearSearch()" class="mt-4 px-3.5 py-2 text-xs font-medium text-emerald-700 bg-emerald-50 rounded-lg hover:bg-emerald-100 transition-colors">
                검색 초기화
            </button>
        </div>

    </main>

    <!-- JavaScript Application Logic -->
    <script>
        // Sample Data Fallback (실습 1 JSON 데이터 및 표준 샘플 데이터)
        const SAMPLE_DATA = {
            "rentBikeStatus": {
                "list_total_count": 12,
                "RESULT": {
                    "CODE": "INFO-000",
                    "MESSAGE": "정상 처리되었습니다"
                },
                "row": [
                    { "stationName": "102. 망원역 1번출구 앞", "parkingBikeTotCnt": "5", "rackTotCnt": "20", "shared": "25" },
                    { "stationName": "103. 망원역 2번출구 앞", "parkingBikeTotCnt": "0", "rackTotCnt": "14", "shared": "0" },
                    { "stationName": "104. 합정역 1번출구 앞", "parkingBikeTotCnt": "12", "rackTotCnt": "25", "shared": "48" },
                    { "stationName": "105. 합정역 5번출구 앞", "parkingBikeTotCnt": "0", "rackTotCnt": "16", "shared": "0" },
                    { "stationName": "106. 신촌역 2번출구 앞", "parkingBikeTotCnt": "8", "rackTotCnt": "20", "shared": "40" },
                    { "stationName": "107. 여의도역 1번출구 옆", "parkingBikeTotCnt": "18", "rackTotCnt": "30", "shared": "60" },
                    { "stationName": "108. 서울역 9번출구 앞", "parkingBikeTotCnt": "3", "rackTotCnt": "15", "shared": "20" },
                    { "stationName": "109. 강남역 11번출구 앞", "parkingBikeTotCnt": "0", "rackTotCnt": "25", "shared": "0" },
                    { "stationName": "110. 홍대입구역 2번출구 앞", "parkingBikeTotCnt": "15", "rackTotCnt": "20", "shared": "75" },
                    { "stationName": "111. 광화문역 6번출구 앞", "parkingBikeTotCnt": "7", "rackTotCnt": "18", "shared": "39" },
                    { "stationName": "112. 잠실역 3번출구 앞", "parkingBikeTotCnt": "21", "rackTotCnt": "30", "shared": "70" },
                    { "stationName": "113. 성수역 4번출구 앞", "parkingBikeTotCnt": "2", "rackTotCnt": "12", "shared": "17" }
                ]
            }
        };

        // Application State Variables
        let rawStationList = []; // Cleaned numeric data array
        let currentFilter = 'all'; // 'all' | 'available' | 'empty'
        let currentSearchQuery = '';
        let currentSort = 'name';

        // Initialize App on DOM Load
        window.addEventListener('DOMContentLoaded', () => {
            fetchBikeStatus();
        });

        /**
         * Fetches data from /api/bike endpoint.
         * Falls back to SAMPLE_DATA on error or non-OK response.
         */
        async function fetchBikeStatus() {
            const refreshIcon = document.getElementById('refresh-icon');
            const badge = document.getElementById('data-source-badge');
            
            // Start spinning animation
            refreshIcon.classList.add('spin-animation');

            try {
                // Attempt fetching from /api/bike API
                const response = await fetch('/api/bike');
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                
                if (data && data.rentBikeStatus && Array.isArray(data.rentBikeStatus.row)) {
                    processStationData(data.rentBikeStatus.row);
                    // Update Badge to Realtime Data
                    badge.textContent = '실시간 데이터';
                    badge.className = 'inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800 border border-emerald-300';
                } else {
                    throw new Error('Invalid JSON structure');
                }

            } catch (error) {
                console.warn('API fetch failed, utilizing sample data:', error.message);
                
                // Process local fallback sample data
                processStationData(SAMPLE_DATA.rentBikeStatus.row);

                // Update Badge to Sample Data
                badge.textContent = '샘플 데이터';
                badge.className = 'inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-100 text-amber-800 border border-amber-300';
            } finally {
                // Stop spinning animation after brief delay for smooth UX
                setTimeout(() => {
                    refreshIcon.classList.remove('spin-animation');
                }, 400);

                // Update last updated timestamp
                updateTimestamp();
            }
        }

        /**
         * Cleans & converts string values into numbers and stores in state.
         * @param {Array} rowData Raw array from rentBikeStatus.row
         */
        function processStationData(rowData) {
            rawStationList = rowData.map(item => {
                const bikes = parseInt(item.parkingBikeTotCnt, 10) || 0;
                const racks = parseInt(item.rackTotCnt, 10) || 0;
                const sharedVal = parseInt(item.shared, 10) || 0;

                return {
                    stationName: item.stationName || '미지정 대여소',
                    parkingBikeTotCnt: bikes,
                    rackTotCnt: racks,
                    shared: sharedVal
                };
            });

            // Update Summary Stats & Render UI
            updateDashboardStats();
            renderStations();
        }

        /**
         * Updates top summary statistics dashboard
         */
        function updateDashboardStats() {
            const totalStations = rawStationList.length;
            const totalBikes = rawStationList.reduce((acc, item) => acc + item.parkingBikeTotCnt, 0);
            const emptyStations = rawStationList.filter(item => item.parkingBikeTotCnt === 0).length;
            
            const totalShared = rawStationList.reduce((acc, item) => acc + item.shared, 0);
            const avgShared = totalStations > 0 ? Math.round(totalShared / totalStations) : 0;

            document.getElementById('stat-total-stations').textContent = totalStations.toLocaleString();
            document.getElementById('stat-total-bikes').textContent = totalBikes.toLocaleString();
            document.getElementById('stat-empty-stations').textContent = emptyStations.toLocaleString();
            document.getElementById('stat-avg-shared').textContent = `${avgShared}%`;
        }

        /**
         * Filters and sorts station list according to user preferences, then renders HTML.
         */
        function renderStations() {
            const container = document.getElementById('station-list');
            const emptyState = document.getElementById('empty-state');
            
            // 1. Filter logic
            let filtered = rawStationList.filter(item => {
                // Search query matching
                const matchesSearch = item.stationName.toLowerCase().includes(currentSearchQuery.toLowerCase());
                
                // Status filter
                let matchesFilter = true;
                if (currentFilter === 'available') {
                    matchesFilter = item.parkingBikeTotCnt > 0;
                } else if (currentFilter === 'empty') {
                    matchesFilter = item.parkingBikeTotCnt === 0;
                }

                return matchesSearch && matchesFilter;
            });

            // 2. Sorting logic
            filtered.sort((a, b) => {
                if (currentSort === 'name') {
                    return a.stationName.localeCompare(b.stationName, 'ko');
                } else if (currentSort === 'bike-desc') {
                    return b.parkingBikeTotCnt - a.parkingBikeTotCnt;
                } else if (currentSort === 'bike-asc') {
                    return a.parkingBikeTotCnt - b.parkingBikeTotCnt;
                } else if (currentSort === 'shared-desc') {
                    return b.shared - a.shared;
                }
                return 0;
            });

            // Empty state handling
            if (filtered.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            // 3. Render Station Cards
            container.innerHTML = filtered.map(item => createStationCardHTML(item)).join('');
        }

        /**
         * Generates HTML card markup for a single station item.
         * Highlights in prominent RED when parkingBikeTotCnt === 0.
         */
        function createStationCardHTML(item) {
            const isEmpty = item.parkingBikeTotCnt === 0;
            
            // Styling classes depending on zero bike state
            const cardBgClass = isEmpty 
                ? 'bg-rose-50/80 border-rose-300 shadow-rose-100/50 hover:border-rose-400' 
                : 'bg-white border-slate-200 hover:border-emerald-300 hover:shadow-md';

            const badgeMarkup = isEmpty
                ? `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-bold bg-rose-600 text-white shadow-sm">
                        <svg class="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                        대여 불가 (0대)
                   </span>`
                : `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800">
                        ${item.parkingBikeTotCnt}대 대여 가능
                   </span>`;

            const bikeCountColor = isEmpty ? 'text-rose-600 font-extrabold' : 'text-emerald-600 font-bold';

            // Calculate progress bar percentage safely
            const capacityRatio = item.rackTotCnt > 0 ? Math.min(Math.round((item.parkingBikeTotCnt / item.rackTotCnt) * 100), 100) : 0;
            const progressBgColor = isEmpty ? 'bg-rose-500' : 'bg-emerald-500';

            return `
                <div class="rounded-xl border p-5 transition-all duration-200 relative overflow-hidden ${cardBgClass}">
                    <!-- Top Section: Station Name & Badge -->
                    <div class="flex items-start justify-between gap-3 mb-3">
                        <h2 class="text-base font-bold text-slate-900 leading-snug break-all">${escapeHTML(item.stationName)}</h2>
                        <div class="flex-shrink-0">
                            ${badgeMarkup}
                        </div>
                    </div>

                    <!-- Middle Section: Main Numbers -->
                    <div class="grid grid-cols-3 gap-2 py-3 my-2 border-y ${isEmpty ? 'border-rose-200/60 bg-rose-100/30' : 'border-slate-100 bg-slate-50'} rounded-lg px-3">
                        <div class="text-center">
                            <span class="block text-[11px] font-medium text-slate-500">대여 가능</span>
                            <span class="text-lg ${bikeCountColor}">${item.parkingBikeTotCnt}<span class="text-xs font-normal text-slate-500">대</span></span>
                        </div>
                        <div class="text-center border-x ${isEmpty ? 'border-rose-200/60' : 'border-slate-200/60'}">
                            <span class="block text-[11px] font-medium text-slate-500">총 거치대</span>
                            <span class="text-lg font-bold text-slate-700">${item.rackTotCnt}<span class="text-xs font-normal text-slate-500">개</span></span>
                        </div>
                        <div class="text-center">
                            <span class="block text-[11px] font-medium text-slate-500">거치율</span>
                            <span class="text-lg font-bold ${isEmpty ? 'text-rose-600' : 'text-slate-800'}">${item.shared}%</span>
                        </div>
                    </div>

                    <!-- Progress Bar for Capacity -->
                    <div class="mt-3">
                        <div class="flex justify-between items-center text-xs text-slate-500 mb-1">
                            <span>거치 상태</span>
                            <span class="font-medium">${capacityRatio}%</span>
                        </div>
                        <div class="w-full bg-slate-200/70 h-2 rounded-full overflow-hidden">
                            <div class="${progressBgColor} h-2 rounded-full transition-all duration-300" style="width: ${capacityRatio}%"></div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Event Listeners & Handlers
        function handleSearch() {
            const input = document.getElementById('search-input');
            const clearBtn = document.getElementById('clear-search-btn');
            currentSearchQuery = input.value.trim();

            if (currentSearchQuery.length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }

            renderStations();
        }

        function clearSearch() {
            const input = document.getElementById('search-input');
            const clearBtn = document.getElementById('clear-search-btn');
            input.value = '';
            currentSearchQuery = '';
            clearBtn.classList.add('hidden');
            renderStations();
        }

        function setFilter(filterType) {
            currentFilter = filterType;

            const btnAll = document.getElementById('filter-all-btn');
            const btnAvailable = document.getElementById('filter-available-btn');
            const btnEmpty = document.getElementById('filter-empty-btn');

            // Reset active button styles
            [btnAll, btnAvailable, btnEmpty].forEach(btn => {
                btn.className = 'px-3 py-1.5 rounded-md text-slate-600 hover:text-slate-900 transition-all';
            });

            // Set active button style
            if (filterType === 'all') {
                btnAll.className = 'px-3 py-1.5 rounded-md bg-white text-slate-900 font-semibold shadow-sm transition-all';
            } else if (filterType === 'available') {
                btnAvailable.className = 'px-3 py-1.5 rounded-md bg-emerald-600 text-white font-semibold shadow-sm transition-all';
            } else if (filterType === 'empty') {
                btnEmpty.className = 'px-3 py-1.5 rounded-md bg-rose-600 text-white font-semibold shadow-sm transition-all';
            }

            renderStations();
        }

        function handleSort() {
            const select = document.getElementById('sort-select');
            currentSort = select.value;
            renderStations();
        }

        function updateTimestamp() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('last-updated-time').textContent = `${year}.${month}.${date} ${hours}:${minutes}:${seconds}`;
        }

        // Security Utility: Sanitizes text string for HTML insertion
        function escapeHTML(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
